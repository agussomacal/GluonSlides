[project]
name = "gluonslides"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=5.0",
    "Pillow",
    "PyYAML",
    "pdf2image",
    "platformdirs",
    "fonttools[woff]>=4.50,<4.69",
]

[dependency-groups]
# Only for building the installable app (packaging/): `uv sync --group build`
build = ["pyinstaller>=6.10"]
