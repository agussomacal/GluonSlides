dependencies:
  - name: katex.min.css
    url: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    description: "KaTeX stylesheet for LaTeX math rendering"

  - name: katex.min.js
    url: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    description: "KaTeX JavaScript rendering engine"

  - name: auto-render.min.js
    url: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    description: "KaTeX auto-render extension"

  - name: html2canvas.min.js
    url: "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    description: "html2canvas library for PDF slide export"

  - name: marked.min.js
    url: "https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
    description: "marked library for markdown support"

  - name: purify.min.js
    url: "https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
    description: "DOMPurify: sanitizes user-authored HTML before rendering"

  - name: codemirror.min.js
    subdir: codemirror
    url: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
    description: "CodeMirror 5 editor used by the .gl inspector"

  - name: codemirror.min.css
    subdir: codemirror
    url: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    description: "CodeMirror 5 base stylesheet"

  - name: show-hint.min.js
    subdir: codemirror
    url: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"
    description: "CodeMirror autocomplete popup (inspector suggestions)"

  - name: show-hint.min.css
    subdir: codemirror
    url: "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css"
    description: "CodeMirror autocomplete popup stylesheet"

